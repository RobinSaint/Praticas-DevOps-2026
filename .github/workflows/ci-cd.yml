name: CI/CD Pipeline Completo

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Testes Unitarios
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_calculator.py -v --cov=src --cov-report=term

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: Testes de Integracao
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      PYTHON_VERSION: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --cov=src --cov-report=term

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: coverage.xml
          retention-days: 7

  coverage-report:
    name: Relatorio de Cobertura
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    env:
      PYTHON_VERSION: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run all tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=html --cov-report=xml

      - name: Check coverage threshold (80 percent)
        run: |
          COVERAGE=$(grep -oP 'TOTAL.*\s(\d+)%' coverage.xml | grep -oP '\d+')
          if [ "$COVERAGE" -lt 80 ]; then
            echo "Coverage $COVERAGE% is below 80% threshold"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets threshold"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage_html/
          retention-days: 14

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/meu-pipeline-completo
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push with commit SHA
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Image info
        run: |
          echo "Imagem Docker publicada:"
          echo "- ${{ env.DOCKER_IMAGE }}:latest"
          echo "- ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker-build, coverage-report]
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/meu-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push with version tag
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
            Docker Image: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
            Commit SHA: ${{ github.sha }}
          draft: false
          prerelease: false